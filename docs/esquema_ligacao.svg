<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="860" viewBox="0 0 1720 860" font-family="Arial, Helvetica, sans-serif">
  <rect width="1720" height="860" fill="#ffffff"/>

  <text x="40" y="45" font-size="22" font-weight="bold" fill="#222">Esquema de ligação – Esteira transportadora</text>

  <!-- ============ FIOS ============ -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- USB -->
    <path d="M300 170 H420" stroke="#777" stroke-width="8"/>

    <!-- motor: D8..D11 -> IN1..IN4 -->
    <path d="M680 200 H860" stroke="#e67e22"/>
    <path d="M680 230 H860" stroke="#f1c40f"/>
    <path d="M680 260 H860" stroke="#27ae60"/>
    <path d="M680 290 H860" stroke="#2980b9"/>

    <!-- sensor: D4 -> OUT -->
    <path d="M680 410 H860" stroke="#8e44ad"/>

    <!-- botão: D13 -> terminal 1 -->
    <path d="M680 520 H845 V600 H905 V578" stroke="#a0522d"/>

    <!-- alimentação do Arduino para os barramentos -->
    <path d="M500 620 V690" stroke="#d62828"/>
    <path d="M600 620 V730" stroke="#111"/>

    <!-- barramentos -->
    <path d="M500 690 H1180" stroke="#d62828"/>
    <path d="M600 730 H1140" stroke="#111"/>

    <!-- sensor: VCC e GND -->
    <path d="M1060 400 H1100 V690" stroke="#d62828"/>
    <path d="M1060 440 H1120 V730" stroke="#111"/>

    <!-- botão: terminal 2 -> GND -->
    <path d="M955 578 V600 H1040 V730" stroke="#111"/>

    <!-- alimentação do driver pelo 5V e GND do Arduino -->
    <path d="M1000 170 V125 H1180 V690" stroke="#d62828"/>
    <path d="M1040 170 V145 H1140 V730" stroke="#111"/>

    <!-- cabo de 5 fios do driver até o motor -->
    <path d="M1060 234 H1220" stroke="#2980b9" stroke-width="3"/>
    <path d="M1060 242 H1220" stroke="#e84393" stroke-width="3"/>
    <path d="M1060 250 H1220" stroke="#f1c40f" stroke-width="3"/>
    <path d="M1060 258 H1220" stroke="#e67e22" stroke-width="3"/>
    <path d="M1060 266 H1220" stroke="#d62828" stroke-width="3"/>
  </g>

  <!-- pontos de junção -->
  <g fill="#111">
    <circle cx="1100" cy="690" r="6" fill="#d62828"/>
    <circle cx="1120" cy="730" r="6"/>
    <circle cx="1040" cy="730" r="6"/>
  </g>

  <!-- rótulos dos barramentos -->
  <text x="510" y="682" font-size="14" fill="#d62828" font-weight="bold">+5V</text>
  <text x="610" y="722" font-size="14" fill="#111" font-weight="bold">GND</text>

  <!-- ============ COMPUTADOR ============ -->
  <rect x="60" y="120" width="240" height="100" rx="6" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
  <text x="180" y="160" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">Computador</text>
  <text x="180" y="184" font-size="14" text-anchor="middle" fill="#444">Servidor Flask (app.py)</text>
  <text x="180" y="204" font-size="14" text-anchor="middle" fill="#444">Porta COM14 – 9600 baud</text>
  <text x="360" y="160" font-size="13" text-anchor="middle" fill="#555">USB</text>

  <!-- ============ ARDUINO ============ -->
  <rect x="420" y="120" width="260" height="500" rx="10" fill="#1f6f8b" stroke="#134b5f" stroke-width="3"/>
  <rect x="408" y="150" width="30" height="40" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <text x="550" y="370" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Arduino Uno</text>

  <g font-size="15" fill="#fff" text-anchor="end">
    <text x="662" y="205">D8</text>
    <text x="662" y="235">D9</text>
    <text x="662" y="265">D10</text>
    <text x="662" y="295">D11</text>
    <text x="662" y="415">D4</text>
    <text x="662" y="525">D13</text>
  </g>
  <g font-size="15" fill="#fff" text-anchor="middle">
    <text x="500" y="605">5V</text>
    <text x="600" y="605">GND</text>
  </g>
  <g fill="#fff" stroke="#134b5f" stroke-width="1">
    <rect x="674" y="194" width="12" height="12"/>
    <rect x="674" y="224" width="12" height="12"/>
    <rect x="674" y="254" width="12" height="12"/>
    <rect x="674" y="284" width="12" height="12"/>
    <rect x="674" y="404" width="12" height="12"/>
    <rect x="674" y="514" width="12" height="12"/>
    <rect x="494" y="614" width="12" height="12"/>
    <rect x="594" y="614" width="12" height="12"/>
  </g>

  <!-- ============ DRIVER ULN2003 ============ -->
  <rect x="860" y="170" width="200" height="175" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
  <text x="960" y="333" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Driver ULN2003</text>
  <g font-size="14" fill="#fff">
    <text x="872" y="205">IN1</text>
    <text x="872" y="235">IN2</text>
    <text x="872" y="265">IN3</text>
    <text x="872" y="295">IN4</text>
  </g>
  <g font-size="14" fill="#fff" text-anchor="middle">
    <text x="1000" y="192">+</text>
    <text x="1040" y="192">−</text>
  </g>

  <!-- ============ ESTEIRA (vista lateral) ============ -->
  <g>
    <!-- estrutura -->
    <rect x="1262" y="292" width="24" height="125" fill="#9aa0ad" stroke="#5f6573" stroke-width="2"/>
    <rect x="1556" y="292" width="24" height="125" fill="#9aa0ad" stroke="#5f6573" stroke-width="2"/>
    <rect x="1250" y="412" width="48" height="10" fill="#7d8391" stroke="#5f6573" stroke-width="2"/>
    <rect x="1544" y="412" width="48" height="10" fill="#7d8391" stroke="#5f6573" stroke-width="2"/>
    <rect x="1262" y="340" width="318" height="14" fill="#9aa0ad" stroke="#5f6573" stroke-width="2"/>
    <rect x="1250" y="266" width="340" height="18" fill="#b3b8c3" stroke="#5f6573" stroke-width="2"/>
    <!-- mancais -->
    <rect x="1230" y="270" width="40" height="28" rx="3" fill="#8c92a0" stroke="#5f6573" stroke-width="2"/>
    <rect x="1560" y="270" width="40" height="28" rx="3" fill="#8c92a0" stroke="#5f6573" stroke-width="2"/>

    <!-- rolos -->
    <circle cx="1580" cy="250" r="28" fill="#c7c9d6" stroke="#555" stroke-width="3"/>
    <circle cx="1580" cy="250" r="6" fill="#666"/>
    <circle cx="1250" cy="250" r="28" fill="#c7c9d6" stroke="#555" stroke-width="3"/>

    <!-- correia -->
    <rect x="1219" y="219" width="392" height="62" rx="31" fill="none" stroke="#222" stroke-width="7"/>

    <!-- caixas sobre a correia -->
    <rect x="1395" y="178" width="54" height="37" fill="#c8a165" stroke="#8b6b3d" stroke-width="2"/>
    <rect x="1500" y="178" width="54" height="37" fill="#c8a165" stroke="#8b6b3d" stroke-width="2"/>

    <!-- sensor infravermelho preso na lateral, no início da esteira -->
    <rect x="1312" y="226" width="44" height="34" rx="3" fill="#37474f" stroke="#263238" stroke-width="2"/>
    <circle cx="1325" cy="243" r="6" fill="#222" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="1343" cy="243" r="6" fill="#222" stroke="#aaa" stroke-width="1.5"/>

    <!-- sentido de transporte -->
    <line x1="1395" y1="160" x2="1545" y2="160" stroke="#444" stroke-width="2"/>
    <path d="M1555 160 L1541 153 L1541 167 Z" fill="#444"/>
    <text x="1470" y="150" font-size="12" fill="#444" text-anchor="middle">sentido de transporte</text>

    <!-- motor 28BYJ-48 preso no eixo do rolo -->
    <rect x="1194" y="238" width="112" height="24" rx="12" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
    <circle cx="1206" cy="250" r="4" fill="#fff" stroke="#555"/>
    <circle cx="1294" cy="250" r="4" fill="#fff" stroke="#555"/>
    <circle cx="1250" cy="250" r="34" fill="#d6d6d6" stroke="#555" stroke-width="3"/>
    <circle cx="1250" cy="250" r="9" fill="#888" stroke="#555"/>
  </g>

  <text x="1415" y="448" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Esteira transportadora</text>
  <text x="1415" y="468" font-size="14" fill="#444" text-anchor="middle">Motor de passo 28BYJ-48 acoplado ao eixo do rolo</text>
  <text x="1415" y="486" font-size="14" fill="#444" text-anchor="middle">Sensor infravermelho fixado no início da esteira</text>
  <text x="1238" y="200" font-size="13" fill="#444" text-anchor="middle">Motor</text>
  <text x="1334" y="200" font-size="13" fill="#444" text-anchor="middle">Sensor</text>

  <!-- ============ SENSOR ============ -->
  <rect x="860" y="370" width="200" height="90" rx="6" fill="#37474f" stroke="#263238" stroke-width="3"/>
  <text x="960" y="452" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Sensor de caixas (IR)</text>
  <g font-size="14" fill="#fff">
    <text x="872" y="415">OUT</text>
    <text x="1048" y="405" text-anchor="end">VCC</text>
    <text x="1048" y="432" text-anchor="end">GND</text>
  </g>

  <!-- ============ BOTÃO DE EMERGÊNCIA (cogumelo) ============ -->
  <g>
    <!-- corpo / caixa do botão -->
    <rect x="885" y="530" width="90" height="48" rx="4" fill="#f2c200" stroke="#9c7c00" stroke-width="2"/>
    <text x="930" y="560" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">NF</text>
    <!-- haste -->
    <rect x="919" y="512" width="22" height="18" fill="#777" stroke="#444" stroke-width="1.5"/>
    <!-- cabeça em forma de cogumelo -->
    <path d="M884 514 C884 476 976 476 976 514 Z" fill="#d62828" stroke="#8b0000" stroke-width="2"/>
    <!-- terminais -->
    <rect x="899" y="576" width="12" height="6" fill="#999"/>
    <rect x="949" y="576" width="12" height="6" fill="#999"/>
  </g>
  <text x="930" y="625" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Botão de emergência</text>
  <text x="930" y="643" font-size="13" fill="#444" text-anchor="middle">tipo cogumelo, com trava (NF)</text>

  <!-- ============ LEGENDA ============ -->
  <g font-size="14" fill="#222">
    <text x="60" y="290" font-weight="bold" font-size="15">Legenda</text>
    <line x1="60" y1="315" x2="100" y2="315" stroke="#d62828" stroke-width="4"/>
    <text x="110" y="320">+5V</text>
    <line x1="60" y1="340" x2="100" y2="340" stroke="#111" stroke-width="4"/>
    <text x="110" y="345">GND (terra comum)</text>
    <line x1="60" y1="365" x2="100" y2="365" stroke="#e67e22" stroke-width="4"/>
    <text x="110" y="370">Bobinas do motor (D8 a D11)</text>
    <line x1="60" y1="390" x2="100" y2="390" stroke="#8e44ad" stroke-width="4"/>
    <text x="110" y="395">Sinal do sensor (D4)</text>
    <line x1="60" y1="415" x2="100" y2="415" stroke="#a0522d" stroke-width="4"/>
    <text x="110" y="420">Botão de emergência (D13)</text>
    <circle cx="80" cy="440" r="6" fill="#111"/>
    <text x="110" y="445">Junção de fios</text>
  </g>

  <g font-size="13" fill="#444">
    <text x="60" y="790">• D4 e D13 usam o resistor de pull-up interno do Arduino (INPUT_PULLUP).</text>
    <text x="60" y="810">• O driver do motor é alimentado pelo 5V do próprio Arduino (sem fonte externa).</text>
    <text x="60" y="830">• Botão NF: solto, o D13 fica em GND; acionado (ou fio rompido), o D13 vai para nível alto e a esteira para.</text>
  </g>
</svg>
