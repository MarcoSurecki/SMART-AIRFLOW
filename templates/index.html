<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAGGAGE CONTROL SYSTEM</title>

    <link rel="stylesheet" href="/static/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- FUNDO / EFEITOS -->
    <div id="particles-js"></div>
    <div class="grid-bg"></div>
    <div class="background-glow"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">

        <div class="topbar">

            <div class="logo-area">
                <img src="/static/img/logo.png" class="logo-img">
                <h1>BAGGAGE CONTROL SYSTEM</h1>
            </div>

            <div class="online" id="statusArduino">
                <span class="pulse"></span>
                VERIFICANDO...
            </div>

        </div>

        <div class="dashboard">

            <!-- VELOCIDADE -->
            <div class="card rpm-card">

                <h2>VELOCIDADE</h2>

                <div class="gauge">
                    <div class="gauge-inner">
                        <span id="rpmValue">10</span>
                        <small>RPM</small>
                    </div>
                </div>

                <input
                    type="range"
                    min="5"
                    max="20"
                    value="10"
                    id="sliderVelocidade"
                    oninput="alterarVelocidade(this.value)"
                >

            </div>

            <div class="card">

                <h2>SENTIDO</h2>

                <div id="sentido-texto" class="modo">
                    HORÁRIO
                </div>

            </div>

            <!-- MODO -->
            <div class="card mode-card">

                <h2>CONTROLE</h2>

                <div id="modo-texto" class="modo">PARADO</div>

                <div class="buttons-grid">

                    <button class="manual-only" onclick="girarDireita()">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <button class="manual-only" onclick="girarEsquerda()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <button onclick="ativarAuto()">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>

                    <button onclick="desativarAuto()">
                        <i class="fa-solid fa-hand"></i>
                    </button>

                </div>

            </div>

        </div>

        <div class="airflow-card">

            <div class="belt-area">

                <div class="belt">

                    <div class="bag bag1">🧳</div>

                    <div class="bag bag2">🧳</div>

                    <div class="bag bag3">🧳</div>

                </div>

            </div>

        </div>

        <!-- BOTÃO PAUSA -->
        <div style="display:flex; gap:15px; justify-content:center; margin-top:20px;">

            <button id="btnPause" class="emergencia" onclick="togglePause()">
                <i class="fa-solid fa-pause"></i>
                PAUSAR
            </button>

        </div>

    </div>

    <!-- CANVAS E NOTIFICAÇÕES -->
    <canvas id="bgCanvas"></canvas>
    <div id="notificacoes"></div>

    <!-- SCRIPTS (ORDEM CORRETA) -->
    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/particles.min.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
